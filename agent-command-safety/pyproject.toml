[project]
name = "cmdpolicy"
version = "1.0.0"
description = "Classify commands an LLM agent proposes as read, mutating or blocked"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Dmitry Buravtsov"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
